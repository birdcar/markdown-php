name: tests

on:
  workflow_call:

jobs:
  core:
    name: core • PHP ${{ matrix.php }} • ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [lowest, stable]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # spec/ fixtures are required by FixtureTestCase
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --prefer-dist --prefer-${{ matrix.deps }}
      - run: composer test

  laravel:
    name: laravel • PHP ${{ matrix.php }} • L${{ matrix.laravel }} • ${{ matrix.deps }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/laravel
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        deps: [lowest, stable]
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          composer require --no-update --dev \
            "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-update \
            "illuminate/support:^${{ matrix.laravel }}.0"
          composer update --no-interaction --prefer-dist --prefer-${{ matrix.deps }} --with-all-dependencies
      - run: composer test

  filament:
    name: filament • PHP ${{ matrix.php }} • L${{ matrix.laravel }} • ${{ matrix.deps }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/filament
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        deps: [lowest, stable]
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        # exclude:  # <-- add here if Filament v4 proves incompatible with Laravel 13
        #   - { laravel: '13' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          composer require --no-update --dev "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer update --no-interaction --prefer-dist --prefer-${{ matrix.deps }} --with-all-dependencies
      - run: composer test

  phpstan:   # Stretch
    name: phpstan • ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: core ('.') is intentionally excluded — it has 11 known
        # pre-existing PHPStan errors from league/commonmark interface
        # implementations. Add '.' here once a baseline is generated for core.
        dir: ['packages/laravel', 'packages/filament']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: ${{ matrix.dir }}
      - run: composer analyse
        working-directory: ${{ matrix.dir }}
